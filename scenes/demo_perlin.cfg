// demo_perlin.cfg — T4.7 showcase (800x600)
// Marble columns and turbulence ground. Shows all three modes in a
// visually coherent scene.

camera:
{
    position = { x = 0.0; y = 2.8; z = 9.5; };
    lookAt   = { x = 0.0; y = 1.0; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 50.0;
    width  = 800;
    height = 600;
};

materials:
{
    // Classic white/grey marble
    marble_white: {
        type = "perlin";
        color1 = { r = 0.96; g = 0.94; b = 0.90; };
        color2 = { r = 0.35; g = 0.32; b = 0.28; };
        scale = 1.2; octaves = 6; mode = "marble";
        ka = 0.12; kd = 0.70; ks = 0.50; shininess = 120.0;
    };
    // Green serpentine marble
    marble_green: {
        type = "perlin";
        color1 = { r = 0.65; g = 0.78; b = 0.55; };
        color2 = { r = 0.10; g = 0.22; b = 0.08; };
        scale = 1.8; octaves = 6; mode = "marble";
        ka = 0.12; kd = 0.70; ks = 0.45; shininess = 100.0;
    };
    // Dark red porphyry marble
    marble_red: {
        type = "perlin";
        color1 = { r = 0.75; g = 0.22; b = 0.18; };
        color2 = { r = 0.18; g = 0.05; b = 0.04; };
        scale = 2.0; octaves = 5; mode = "marble";
        ka = 0.12; kd = 0.68; ks = 0.40; shininess = 80.0;
    };
    // Smooth noise: blue-purple plasma
    plasma: {
        type = "perlin";
        color1 = { r = 0.80; g = 0.60; b = 1.00; };
        color2 = { r = 0.10; g = 0.05; b = 0.40; };
        scale = 1.5; octaves = 4; mode = "noise";
        ka = 0.12; kd = 0.70; ks = 0.35; shininess = 64.0;
    };
    // Turbulence: rocky sandy ground
    ground: {
        type = "perlin";
        color1 = { r = 0.68; g = 0.60; b = 0.46; };
        color2 = { r = 0.28; g = 0.22; b = 0.14; };
        scale = 0.6; octaves = 5; mode = "turbulence";
        ka = 0.16; kd = 0.82; ks = 0.05; shininess = 6.0;
    };
};

primitives:
{
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "ground"; }
    );
    spheres = (
        // Front row
        { center = { x = -3.0; y = 1.0; z =  2.0; }; radius = 1.0; material = "marble_white"; },
        { center = { x =  0.0; y = 1.0; z =  2.0; }; radius = 1.0; material = "plasma";       },
        { center = { x =  3.0; y = 1.0; z =  2.0; }; radius = 1.0; material = "marble_red";   },
        // Back row
        { center = { x = -1.8; y = 0.8; z = -1.0; }; radius = 0.8; material = "marble_green"; },
        { center = { x =  1.8; y = 0.8; z = -1.0; }; radius = 0.8; material = "marble_white"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.15; }
    );
    directional = (
        { direction = { x = -1.0; y = -2.0; z = -1.0; };
          color = { r = 1.0; g = 0.96; b = 0.88; }; intensity = 0.88; },
        { direction = { x =  1.5; y = -1.5; z = -0.5; };
          color = { r = 0.72; g = 0.84; b = 1.00; }; intensity = 0.28; }
    );
};
