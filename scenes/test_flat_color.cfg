// test_flat_color.cfg — T1.5
// Verifies parseMaterials + FlatColor plugin:
//   - Two named flat-color materials (red, blue)
//   - One sphere and one plane, each assigned a material (T1.7)
//   - Ambient + directional lighting loaded (shading applied in T1.6)

camera:
{
    position = { x = 0.0; y = 2.0; z = 6.0; };
    lookAt   = { x = 0.0; y = 0.0; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 45.0;
    width  = 320;
    height = 240;
};

materials:
{
    red:
    {
        type  = "flat_color";
        color = { r = 1.0; g = 0.2; b = 0.2; };
    };
    blue:
    {
        type  = "flat_color";
        color = { r = 0.2; g = 0.4; b = 1.0; };
    };
};

primitives:
{
    spheres = (
        { center = { x = 0.0; y = 0.5; z = 0.0; }; radius = 0.5; material = "red"; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0; material = "blue"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.2; }
    );
    directional = (
        { direction = { x = -1.0; y = -2.0; z = -1.0; }; color = { r = 1.0; g = 1.0; b = 0.9; }; intensity = 1.0; }
    );
};
