// test_translation.cfg — T1.7
// Demonstrates:
//   - material assignment by name (red sphere, blue floor)
//   - translate field: two spheres sharing the same base center={0,0,0}
//     but positioned differently via translate

camera:
{
    position = { x = 0.0; y = 2.0; z = 7.0; };
    lookAt   = { x = 0.0; y = 0.5; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 45.0;
    width  = 320;
    height = 240;
};

materials:
{
    red:   { type = "flat_color"; color = { r = 1.0; g = 0.2; b = 0.2; }; };
    green: { type = "flat_color"; color = { r = 0.2; g = 0.9; b = 0.2; }; };
    blue:  { type = "flat_color"; color = { r = 0.2; g = 0.4; b = 1.0; }; };
};

primitives:
{
    spheres = (
        // Left sphere: canonical center at origin, translated left
        { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.5;
          material = "red";
          translate = { x = -1.2; y = 0.5; z = 0.0; }; },
        // Right sphere: translated right
        { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.5;
          material = "green";
          translate = { x =  1.2; y = 0.5; z = 0.0; }; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "blue"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.2; }
    );
    directional = (
        { direction = { x = -1.0; y = -2.0; z = -1.0; };
          color = { r = 1.0; g = 1.0; b = 0.9; }; intensity = 1.0; }
    );
};
