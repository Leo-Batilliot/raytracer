// test_scene_graph.cfg — T4.5 minimal test (320x240)
// Two groups, each containing two spheres.
// Group 1 (left):  translated to (-3, 0, 0), no rotation.
// Group 2 (right): translated to (+3, 0, 0), rotated 45° around Y.
// Expected: 4 visible spheres, right pair slightly rotated relative to left.

camera:
{
    position = { x = 0.0; y = 3.0; z = 10.0; };
    lookAt   = { x = 0.0; y = 0.5; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 45.0;
    width  = 320;
    height = 240;
};

materials:
{
    red:   { type = "flat_color"; color = { r = 0.9; g = 0.1; b = 0.1; }; };
    blue:  { type = "flat_color"; color = { r = 0.1; g = 0.3; b = 0.9; }; };
    green: { type = "flat_color"; color = { r = 0.1; g = 0.8; b = 0.2; }; };
    gold:  { type = "flat_color"; color = { r = 1.0; g = 0.8; b = 0.0; }; };
    floor: { type = "flat_color"; color = { r = 0.5; g = 0.5; b = 0.5; }; };
};

// Flat floor as a standalone primitive (no group needed).
primitives:
{
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0; material = "floor"; }
    );
};

// Scene-graph groups.
groups = (
    // Group 1 — left cluster, no rotation.
    {
        translate = { x = -3.0; y = 0.0; z = 0.0; };
        children:
        {
            spheres = (
                { center = { x = 0.0; y = 0.6; z = 0.0; }; radius = 0.6; material = "red"; },
                { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.4; translate = { x = 0.0; y = 1.6; z = 0.0; }; material = "blue"; }
            );
        };
    },
    // Group 2 — right cluster, 45° rotation around Y.
    {
        translate = { x =  3.0; y = 0.0; z = 0.0; };
        rotate    = { x =  0.0; y = 45.0; z = 0.0; };
        children:
        {
            spheres = (
                { center = { x = 0.0; y = 0.6; z = 0.0; }; radius = 0.6; material = "green"; },
                { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.4; translate = { x = 0.0; y = 1.6; z = 0.0; }; material = "gold"; }
            );
        };
    }
);

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.20; }
    );
    directional = (
        { direction = { x = -1.0; y = -2.0; z = -1.0; };
          color = { r = 1.0; g = 0.96; b = 0.88; }; intensity = 0.85; }
    );
};
