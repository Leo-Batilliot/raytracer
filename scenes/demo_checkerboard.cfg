// demo_checkerboard.cfg — T4.6 showcase (800x600)
// Classic chess-floor scene: 6 colored Phong spheres on a
// black/white checkerboard floor. One mirror sphere shows the
// floor pattern reflected. Two directional lights for rich shading.

camera:
{
    position = { x = 0.0; y = 3.5; z = 10.0; };
    lookAt   = { x = 0.0; y = 0.5; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 52.0;
    width  = 800;
    height = 600;
};

materials:
{
    // Floor — classic chess colors, scale=0.6 → tiles ~1.67 units wide
    floor: {
        type   = "checkerboard";
        color1 = { r = 0.94; g = 0.92; b = 0.86; };
        color2 = { r = 0.08; g = 0.08; b = 0.08; };
        scale  = 0.6;
        ka = 0.15; kd = 0.80; ks = 0.12; shininess = 24.0;
    };

    // Colored spheres
    crimson: {
        type = "phong"; color = { r = 0.85; g = 0.12; b = 0.12; };
        ka = 0.12; kd = 0.70; ks = 0.40; shininess = 80.0;
    };
    cobalt: {
        type = "phong"; color = { r = 0.10; g = 0.28; b = 0.88; };
        ka = 0.12; kd = 0.70; ks = 0.40; shininess = 80.0;
    };
    amber: {
        type = "phong"; color = { r = 1.00; g = 0.62; b = 0.00; };
        ka = 0.12; kd = 0.70; ks = 0.35; shininess = 60.0;
    };
    jade: {
        type = "phong"; color = { r = 0.00; g = 0.64; b = 0.38; };
        ka = 0.12; kd = 0.70; ks = 0.35; shininess = 60.0;
    };
    violet: {
        type = "phong"; color = { r = 0.55; g = 0.12; b = 0.88; };
        ka = 0.12; kd = 0.70; ks = 0.40; shininess = 80.0;
    };

    // Mirror sphere — reflects the checkerboard floor
    mirror: {
        type = "mirror"; color = { r = 0.96; g = 0.96; b = 0.96; };
        reflectivity = 0.92;
        ka = 0.05; kd = 0.10; ks = 0.80; shininess = 256.0;
    };
};

primitives:
{
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "floor"; }
    );
    spheres = (
        // Front row
        { center = { x = -3.0; y = 0.7; z =  2.0; }; radius = 0.7; material = "crimson"; },
        { center = { x =  0.0; y = 0.7; z =  2.0; }; radius = 0.7; material = "cobalt";  },
        { center = { x =  3.0; y = 0.7; z =  2.0; }; radius = 0.7; material = "amber";   },
        // Back row
        { center = { x = -2.0; y = 0.7; z = -1.5; }; radius = 0.7; material = "jade";   },
        { center = { x =  2.0; y = 0.7; z = -1.5; }; radius = 0.7; material = "violet"; },
        // Mirror sphere — center stage
        { center = { x =  0.0; y = 1.0; z = -1.0; }; radius = 1.0; material = "mirror"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.14; }
    );
    directional = (
        // Key light: warm, upper left
        { direction = { x = -1.0; y = -2.0; z = -1.0; };
          color = { r = 1.0; g = 0.96; b = 0.88; }; intensity = 0.90; },
        // Fill light: cool, upper right
        { direction = { x =  1.5; y = -1.5; z = -0.5; };
          color = { r = 0.72; g = 0.84; b = 1.00; }; intensity = 0.28; }
    );
};
