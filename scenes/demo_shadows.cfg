// demo_shadows.cfg — T2.4 showcase (800x600)
// Rich scene demonstrating hard shadows from a single key light.
// - 6 spheres of different sizes arranged around a central cylinder
// - 2 cones adding variety
// - Horizontal floor receives all the shadows
// - Strong key light from upper-left; very low ambient to make shadows dramatic

camera:
{
    position = { x = 2.0; y = 5.0; z = 10.0; };
    lookAt   = { x = 0.0; y = 0.5; z =  0.0; };
    up       = { x = 0.0; y = 1.0; z =  0.0; };
    fov    = 48.0;
    width  = 800;
    height = 600;
};

materials:
{
    ruby:     { type = "flat_color"; color = { r = 0.80; g = 0.10; b = 0.10; }; };
    sapphire: { type = "flat_color"; color = { r = 0.10; g = 0.20; b = 0.85; }; };
    emerald:  { type = "flat_color"; color = { r = 0.05; g = 0.70; b = 0.30; }; };
    gold:     { type = "flat_color"; color = { r = 1.00; g = 0.80; b = 0.00; }; };
    ivory:    { type = "flat_color"; color = { r = 0.95; g = 0.94; b = 0.86; }; };
    coral:    { type = "flat_color"; color = { r = 1.00; g = 0.40; b = 0.30; }; };
    teal:     { type = "flat_color"; color = { r = 0.00; g = 0.60; b = 0.60; }; };
    violet:   { type = "flat_color"; color = { r = 0.55; g = 0.10; b = 0.85; }; };
    floor:    { type = "flat_color"; color = { r = 0.82; g = 0.80; b = 0.76; }; };
};

primitives:
{
    spheres = (
        // Central large sphere
        { center = { x =  0.0; y = 1.0; z =  0.0; }; radius = 1.0; material = "ivory"; },
        // Surrounding smaller spheres
        { center = { x =  2.5; y = 0.5; z =  0.5; }; radius = 0.5; material = "ruby"; },
        { center = { x = -2.5; y = 0.5; z =  0.5; }; radius = 0.5; material = "sapphire"; },
        { center = { x =  1.5; y = 0.5; z = -2.0; }; radius = 0.5; material = "emerald"; },
        { center = { x = -1.5; y = 0.5; z = -2.0; }; radius = 0.5; material = "gold"; },
        // Tall thin sphere in background to cast a long shadow
        { center = { x = -3.5; y = 1.2; z = -1.5; }; radius = 0.35; material = "coral"; }
    );

    cylinders = (
        // Upright cylinder to the right — casts a crisp shadow
        { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.25; height = 3.0;
          material = "teal";
          translate = { x = 3.5; y = 1.5; z = -1.0; }; }
    );

    cones = (
        // Tilted cone — shadow shape changes along the floor
        { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.6; height = 2.0;
          material = "violet";
          rotate    = { x = 15.0; y = 0.0; z = 0.0; };
          translate = { x = -3.5; y = 1.0; z =  0.5; }; }
    );

    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0; material = "floor"; }
    );
};

lights:
{
    // Very low ambient: shadows are dark and dramatic
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.06; }
    );
    directional = (
        // Strong key light from upper-left
        { direction = { x = -1.5; y = -3.0; z = -0.8; };
          color = { r = 1.0; g = 0.95; b = 0.85; }; intensity = 1.1; }
    );
};
