// test_rotation.cfg — T2.3
// Demonstrates the rotate field on primitives.
// Cylinder normally stands upright (along Y). Here rotate.z=90 tips it onto
// its side (now along X). The cone is tilted 30° forward (rotate.x=30).

camera:
{
    position = { x = 0.0; y = 3.0; z = 8.0; };
    lookAt   = { x = 0.0; y = 0.5; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 45.0;
    width  = 320;
    height = 240;
};

materials:
{
    cobalt: { type = "flat_color"; color = { r = 0.08; g = 0.28; b = 0.92; }; };
    amber:  { type = "flat_color"; color = { r = 1.00; g = 0.55; b = 0.00; }; };
    floor:  { type = "flat_color"; color = { r = 0.70; g = 0.69; b = 0.67; }; };
};

primitives:
{
    cylinders = (
        // Cylinder tipped on its side: canonical axis=Y, rotated 90° around Z → axis=X
        { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.4; height = 2.5;
          material = "cobalt";
          rotate    = { x = 0.0; y = 0.0; z = 90.0; };
          translate = { x = 0.0; y = 0.4; z = 0.5; }; }
    );
    cones = (
        // Cone tilted 30° forward (rotate around X)
        { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.5; height = 1.5;
          material = "amber";
          rotate    = { x = 30.0; y = 0.0; z = 0.0; };
          translate = { x = -1.8; y = 0.75; z = 0.0; }; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "floor"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.2; }
    );
    directional = (
        { direction = { x = -1.0; y = -2.0; z = -0.8; };
          color = { r = 1.0; g = 0.97; b = 0.88; }; intensity = 1.0; }
    );
};
