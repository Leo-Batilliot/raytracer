// test_point_light.cfg — T4.10 minimal test (320x240)
// Three spheres lit by a single colored point light above-center.
// Expected: spheres bright on the side facing the light, dark on the
// other side, with a clear shadow on the floor.

camera:
{
    position = { x = 0.0; y = 3.0; z = 8.0; };
    lookAt   = { x = 0.0; y = 0.5; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 45.0;
    width  = 320;
    height = 240;
};

materials:
{
    red:   { type = "phong"; color = { r = 0.85; g = 0.12; b = 0.12; };
             ka = 0.05; kd = 0.70; ks = 0.40; shininess = 80.0; };
    white: { type = "phong"; color = { r = 0.90; g = 0.90; b = 0.90; };
             ka = 0.05; kd = 0.70; ks = 0.50; shininess = 128.0; };
    blue:  { type = "phong"; color = { r = 0.10; g = 0.25; b = 0.85; };
             ka = 0.05; kd = 0.70; ks = 0.40; shininess = 80.0; };
    floor: { type = "flat_color"; color = { r = 0.55; g = 0.55; b = 0.55; }; };
};

primitives:
{
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "floor"; }
    );
    spheres = (
        { center = { x = -2.0; y = 0.7; z = 0.0; }; radius = 0.7; material = "red";   },
        { center = { x =  0.0; y = 0.7; z = 0.0; }; radius = 0.7; material = "white"; },
        { center = { x =  2.0; y = 0.7; z = 0.0; }; radius = 0.7; material = "blue";  }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.08; }
    );
    // Single warm point light above center
    point = (
        { position  = { x = 0.0; y = 4.0; z = 2.0; };
          color     = { r = 1.0; g = 0.85; b = 0.60; };
          intensity = 12.0;
          constant  = 1.0; linear = 0.14; quadratic = 0.07; }
    );
};
