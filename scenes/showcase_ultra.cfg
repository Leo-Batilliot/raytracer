// showcase_ultra.cfg — Full feature showcase (1280×720)
//
// Features demonstrated:
//   Primitives    : sphere, plane, cylinder, cone (+ rotation, translation)
//   Materials     : phong, mirror, glass, checkerboard, perlin (3 modes), texture
//   Lights        : ambient + 2 directional + 3 point (colored, attenuated)
//   Scene graph   : group of small spheres with shared rotation transform
//   Antialiasing  : adaptive 3×3 (smooth edges, fast flat areas)
//   BVH + threads : implicit (always active)

camera:
{
    position = { x = 0.0; y = 4.2; z = 13.0; };
    lookAt   = { x = 0.0; y = 1.2; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 55.0;
    width  = 1280;
    height = 720;
};

antialiasing:
{
    samples   = 3;
    adaptive  = true;
    threshold = 0.04;
};

// ──────────────────────────────────────────────────────────────────
// Materials
// ──────────────────────────────────────────────────────────────────
materials:
{
    // Floor — warm marble
    marble_floor: {
        type = "perlin";
        color1 = { r = 0.95; g = 0.92; b = 0.84; };
        color2 = { r = 0.32; g = 0.26; b = 0.20; };
        scale = 0.35; octaves = 6; mode = "marble";
        ka = 0.10; kd = 0.75; ks = 0.20; shininess = 40.0;
    };

    // Hero sphere — crystal glass
    crystal: {
        type = "glass";
        transparency = 0.97; ior = 1.52;
        color = { r = 0.95; g = 0.97; b = 1.00; };
        ka = 0.03; kd = 0.05; ks = 0.90; shininess = 300.0;
    };

    // Diamond glass — high IOR
    diamond: {
        type = "glass";
        transparency = 0.95; ior = 2.42;
        color = { r = 0.92; g = 0.96; b = 1.00; };
        ka = 0.03; kd = 0.05; ks = 0.92; shininess = 400.0;
    };

    // Mirror spheres
    gold_mirror: {
        type = "mirror";
        color = { r = 1.00; g = 0.88; b = 0.60; };
        reflectivity = 0.92;
        ka = 0.05; kd = 0.10; ks = 0.85; shininess = 250.0;
    };
    silver_mirror: {
        type = "mirror";
        color = { r = 0.90; g = 0.90; b = 0.92; };
        reflectivity = 0.88;
        ka = 0.05; kd = 0.12; ks = 0.85; shininess = 300.0;
    };

    // Phong — vivid colors
    cobalt: {
        type = "phong"; color = { r = 0.08; g = 0.25; b = 0.90; };
        ka = 0.10; kd = 0.70; ks = 0.45; shininess = 90.0;
    };
    crimson: {
        type = "phong"; color = { r = 0.88; g = 0.10; b = 0.10; };
        ka = 0.10; kd = 0.70; ks = 0.45; shininess = 90.0;
    };
    jade: {
        type = "phong"; color = { r = 0.00; g = 0.62; b = 0.38; };
        ka = 0.10; kd = 0.70; ks = 0.35; shininess = 70.0;
    };
    amber: {
        type = "phong"; color = { r = 1.00; g = 0.62; b = 0.00; };
        ka = 0.10; kd = 0.72; ks = 0.40; shininess = 80.0;
    };
    violet: {
        type = "phong"; color = { r = 0.55; g = 0.12; b = 0.88; };
        ka = 0.10; kd = 0.68; ks = 0.50; shininess = 100.0;
    };

    // Checkerboard — black/white
    checker: {
        type = "checkerboard";
        color1 = { r = 0.95; g = 0.95; b = 0.95; };
        color2 = { r = 0.05; g = 0.05; b = 0.05; };
        scale = 2.0;
        ka = 0.12; kd = 0.75; ks = 0.30; shininess = 60.0;
    };

    // Perlin — cloud/gas planet look
    nebula: {
        type = "perlin";
        color1 = { r = 0.85; g = 0.65; b = 1.00; };
        color2 = { r = 0.10; g = 0.05; b = 0.40; };
        scale = 1.8; octaves = 4; mode = "noise";
        ka = 0.12; kd = 0.72; ks = 0.25; shininess = 40.0;
    };

    // Perlin — turbulence rocky
    rocky: {
        type = "perlin";
        color1 = { r = 0.65; g = 0.58; b = 0.45; };
        color2 = { r = 0.22; g = 0.18; b = 0.12; };
        scale = 1.2; octaves = 5; mode = "turbulence";
        ka = 0.14; kd = 0.80; ks = 0.08; shininess = 8.0;
    };

    // Texture — earth
    earth: {
        type = "texture"; file = "textures/earth.ppm";
        scale_u = 1.0; scale_v = 1.0;
        ka = 0.10; kd = 0.75; ks = 0.20; shininess = 32.0;
    };

    // Texture — brick (for cylinder)
    brick: {
        type = "texture"; file = "textures/brick.ppm";
        scale_u = 3.0; scale_v = 2.0;
        ka = 0.14; kd = 0.82; ks = 0.06; shininess = 6.0;
    };

    // Marble white columns
    marble_col: {
        type = "perlin";
        color1 = { r = 0.96; g = 0.93; b = 0.88; };
        color2 = { r = 0.28; g = 0.22; b = 0.16; };
        scale = 1.5; octaves = 6; mode = "marble";
        ka = 0.12; kd = 0.70; ks = 0.50; shininess = 120.0;
    };
};

// ──────────────────────────────────────────────────────────────────
// Geometry
// ──────────────────────────────────────────────────────────────────
primitives:
{
    planes = (
        // Floor
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "marble_floor"; }
    );

    spheres = (
        // ── CENTER ── large crystal glass hero
        { center = { x =  0.0; y = 1.6; z =  0.5; }; radius = 1.6;
          material = "crystal"; },

        // ── LEFT ── gold mirror
        { center = { x = -3.8; y = 1.0; z =  1.5; }; radius = 1.0;
          material = "gold_mirror"; },

        // ── RIGHT ── silver mirror
        { center = { x =  3.8; y = 1.0; z =  1.5; }; radius = 1.0;
          material = "silver_mirror"; },

        // ── MID LEFT ── earth texture
        { center = { x = -2.2; y = 0.7; z = -0.5; }; radius = 0.7;
          material = "earth"; },

        // ── MID RIGHT ── checkerboard
        { center = { x =  2.2; y = 0.7; z = -0.5; }; radius = 0.7;
          material = "checker"; },

        // ── FAR LEFT ── diamond
        { center = { x = -5.5; y = 0.8; z = -1.5; }; radius = 0.8;
          material = "diamond"; },

        // ── FAR RIGHT ── nebula
        { center = { x =  5.5; y = 0.8; z = -1.5; }; radius = 0.8;
          material = "nebula"; },

        // ── BACKGROUND ── large marble sphere
        { center = { x =  0.0; y = 1.2; z = -4.5; }; radius = 1.2;
          material = "marble_col"; },

        // ── SMALL FOREGROUND ──
        { center = { x = -1.5; y = 0.4; z =  4.0; }; radius = 0.4;
          material = "cobalt"; },
        { center = { x =  1.5; y = 0.4; z =  4.0; }; radius = 0.4;
          material = "crimson"; },
        { center = { x =  0.0; y = 0.35; z = 4.5; }; radius = 0.35;
          material = "jade"; },

        // ── DISTANT ACCENTS ──
        { center = { x = -7.5; y = 0.5; z =  0.0; }; radius = 0.5;
          material = "violet"; },
        { center = { x =  7.5; y = 0.5; z =  0.0; }; radius = 0.5;
          material = "amber"; }
    );

    cylinders = (
        // Brick column — left
        { center = { x = -6.0; y = 0.0; z = -1.0; }; radius = 0.45; height = 4.5;
          material = "brick"; },
        // Rocky column — right
        { center = { x =  6.0; y = 0.0; z = -1.0; }; radius = 0.45; height = 4.0;
          material = "rocky"; },
        // Marble plinth under crystal
        { center = { x =  0.0; y = 0.0; z =  0.5; }; radius = 0.7; height = 0.5;
          material = "marble_col"; }
    );

    cones = (
        // Amber cone — far left
        { center = { x = -8.0; y = 0.0; z = -0.5; }; radius = 0.65; height = 2.2;
          material = "amber"; },
        // Cobalt cone — far right
        { center = { x =  8.0; y = 0.0; z = -0.5; }; radius = 0.65; height = 2.2;
          material = "cobalt";
          rotate = { x = 0.0; y = 20.0; z = 0.0; }; }
    );
};

// Group — orbiting cluster of small colorful spheres (rotated around center)
groups = (
    {
        translate = { x =  3.0; y = 0.0; z =  3.5; };
        rotate    = { x =  0.0; y = 35.0; z = 0.0; };
        children:
        {
            spheres = (
                { center = { x =  0.0; y = 0.38; z = 0.0;  }; radius = 0.38;
                  material = "violet"; },
                { center = { x =  0.9; y = 0.28; z = 0.0;  }; radius = 0.28;
                  material = "jade"; },
                { center = { x = -0.9; y = 0.28; z = 0.0;  }; radius = 0.28;
                  material = "amber"; },
                { center = { x =  0.0; y = 0.22; z = 0.85; }; radius = 0.22;
                  material = "crimson"; }
            );
        };
    },
    {
        translate = { x = -3.0; y = 0.0; z =  3.5; };
        rotate    = { x =  0.0; y = -25.0; z = 0.0; };
        children:
        {
            spheres = (
                { center = { x =  0.0; y = 0.38; z = 0.0;  }; radius = 0.38;
                  material = "cobalt"; },
                { center = { x =  0.9; y = 0.26; z = 0.0;  }; radius = 0.26;
                  material = "crimson"; },
                { center = { x = -0.9; y = 0.26; z = 0.0;  }; radius = 0.26;
                  material = "jade"; }
            );
        };
    }
);

// ──────────────────────────────────────────────────────────────────
// Lights
// ──────────────────────────────────────────────────────────────────
lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.10; }
    );

    directional = (
        // Key light — warm, upper left
        { direction = { x = -1.0; y = -2.0; z = -1.0; };
          color = { r = 1.00; g = 0.96; b = 0.86; }; intensity = 0.55; },
        // Rim light — cool blue, from behind
        { direction = { x =  0.3; y = -0.8; z =  1.0; };
          color = { r = 0.50; g = 0.62; b = 0.90; }; intensity = 0.18; }
    );

    point = (
        // Warm white overhead
        { position  = { x =  0.0; y = 7.0; z =  1.0; };
          color     = { r = 1.00; g = 0.96; b = 0.88; };
          intensity = 3.5;
          constant  = 1.0; linear = 0.09; quadratic = 0.032; },

        // Warm orange — left accent
        { position  = { x = -5.0; y = 4.0; z =  4.0; };
          color     = { r = 1.00; g = 0.48; b = 0.15; };
          intensity = 3.0;
          constant  = 1.0; linear = 0.18; quadratic = 0.10; },

        // Cool blue — right accent
        { position  = { x =  5.0; y = 4.0; z =  4.0; };
          color     = { r = 0.25; g = 0.45; b = 1.00; };
          intensity = 3.0;
          constant  = 1.0; linear = 0.18; quadratic = 0.10; }
    );
};
