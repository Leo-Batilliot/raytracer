// test_cone.cfg — T2.2
// Finite cone: apex at top, base disk visible from slight elevation.

camera:
{
    position = { x = 2.0; y = 3.5; z = 6.0; };
    lookAt   = { x = 0.0; y = 1.0; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 45.0;
    width  = 320;
    height = 240;
};

materials:
{
    orange: { type = "flat_color"; color = { r = 1.00; g = 0.50; b = 0.00; }; };
    floor:  { type = "flat_color"; color = { r = 0.72; g = 0.71; b = 0.69; }; };
};

primitives:
{
    cones = (
        { center = { x = 0.0; y = 1.0; z = 0.0; };
          radius = 0.8; height = 2.0; material = "orange"; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "floor"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.18; }
    );
    directional = (
        { direction = { x = -1.0; y = -2.0; z = -0.8; };
          color = { r = 1.0; g = 0.97; b = 0.88; }; intensity = 1.0; }
    );
};
