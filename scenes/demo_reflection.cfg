// demo_reflection.cfg — Reflection showcase (T4.2)
// Three mirror spheres with varying reflectivity on a coloured tiled floor.
// The spheres reflect each other (up to kMaxBounces=5 bounces).

camera:
{
    position = { x = 0.0; y = 3.5; z = 9.0; };
    lookAt   = { x = 0.0; y = 1.0; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov      = 50.0;
    width    = 800;
    height   = 600;
};

materials:
{
    perfect_mirror:
    {
        type         = "mirror";
        reflectivity = 1.0;
        color        = { r = 0.85; g = 0.85; b = 0.9; };
        shininess    = 512.0;
        ks           = 0.95;
        ka           = 0.02;
        kd           = 0.1;
    };
    gold_mirror:
    {
        type         = "mirror";
        reflectivity = 0.75;
        color        = { r = 0.8; g = 0.6; b = 0.2; };
        shininess    = 128.0;
        ks           = 0.8;
        specular     = { r = 1.0; g = 0.9; b = 0.5; };
        ka           = 0.05;
        kd           = 0.4;
    };
    partial_mirror:
    {
        type         = "mirror";
        reflectivity = 0.45;
        color        = { r = 0.2; g = 0.4; b = 0.8; };
        shininess    = 64.0;
        ks           = 0.5;
        ka           = 0.05;
        kd           = 0.7;
    };
    // Non-reflective coloured spheres for reflected content
    red_sphere:
    {
        type  = "phong";
        color = { r = 0.85; g = 0.1; b = 0.1; };
        ka = 0.05; kd = 0.9; ks = 0.3; shininess = 32.0;
    };
    green_sphere:
    {
        type  = "phong";
        color = { r = 0.1; g = 0.7; b = 0.15; };
        ka = 0.05; kd = 0.9; ks = 0.3; shininess = 32.0;
    };
    grey_floor:
    {
        type  = "flat_color";
        color = { r = 0.45; g = 0.45; b = 0.45; };
    };
};

primitives:
{
    spheres = (
        // Three mirror spheres — front row
        { center = { x = -2.5; y = 1.0; z = 0.0; }; radius = 1.0;
          material = "perfect_mirror"; },
        { center = { x =  0.0; y = 1.0; z = 0.0; }; radius = 1.0;
          material = "gold_mirror"; },
        { center = { x =  2.5; y = 1.0; z = 0.0; }; radius = 1.0;
          material = "partial_mirror"; },
        // Coloured non-reflective spheres behind — appear in reflections
        { center = { x = -1.5; y = 0.6; z = -3.5; }; radius = 0.6;
          material = "red_sphere"; },
        { center = { x =  1.5; y = 0.6; z = -3.5; }; radius = 0.6;
          material = "green_sphere"; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "grey_floor"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.08; }
    );
    directional = (
        {
            direction = { x = -0.3; y = -1.0; z = -0.4; };
            color     = { r = 1.0; g = 0.98; b = 0.95; };
            intensity = 1.0;
        },
        {
            direction = { x =  0.6; y = -0.5; z = -0.2; };
            color     = { r = 0.4; g = 0.5; b = 0.7; };
            intensity = 0.25;
        }
    );
};
