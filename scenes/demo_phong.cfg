// demo_phong.cfg — Phong reflection model showcase (T4.1)
// Five spheres with different Phong parameters on a grey plane:
//   - Red plastic   (shininess 16,  ks 0.3)
//   - Blue plastic  (shininess 32,  ks 0.4)
//   - Gold          (shininess 64,  ks 0.7, warm specular)
//   - Silver/mirror (shininess 256, ks 0.9)
//   - Green matte   (shininess 0 via flat_color — no specular, for contrast)

camera:
{
    position = { x = 0.0; y = 3.0; z = 9.0; };
    lookAt   = { x = 0.0; y = 0.5; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov      = 55.0;
    width    = 800;
    height   = 600;
};

materials:
{
    red_plastic:
    {
        type      = "phong";
        color     = { r = 0.8; g = 0.1; b = 0.1; };
        ka        = 0.05;
        kd        = 0.9;
        ks        = 0.3;
        shininess = 16.0;
        specular  = { r = 1.0; g = 1.0; b = 1.0; };
    };
    blue_plastic:
    {
        type      = "phong";
        color     = { r = 0.1; g = 0.2; b = 0.85; };
        ka        = 0.05;
        kd        = 0.9;
        ks        = 0.4;
        shininess = 32.0;
        specular  = { r = 1.0; g = 1.0; b = 1.0; };
    };
    gold:
    {
        type      = "phong";
        color     = { r = 0.75; g = 0.55; b = 0.1; };
        ka        = 0.05;
        kd        = 0.7;
        ks        = 0.7;
        shininess = 64.0;
        specular  = { r = 1.0; g = 0.9; b = 0.5; };  // warm gold highlight
    };
    silver:
    {
        type      = "phong";
        color     = { r = 0.6; g = 0.6; b = 0.65; };
        ka        = 0.05;
        kd        = 0.5;
        ks        = 0.9;
        shininess = 256.0;
        specular  = { r = 1.0; g = 1.0; b = 1.0; };
    };
    green_matte:
    {
        type  = "flat_color";
        color = { r = 0.15; g = 0.65; b = 0.2; };
    };
    grey_floor:
    {
        type  = "flat_color";
        color = { r = 0.4; g = 0.4; b = 0.4; };
    };
};

primitives:
{
    spheres = (
        { center = { x = -3.5; y = 1.0; z = 0.0; }; radius = 1.0; material = "red_plastic"; },
        { center = { x = -1.5; y = 1.0; z = 0.5; }; radius = 1.0; material = "blue_plastic"; },
        { center = { x =  0.8; y = 1.0; z = 0.0; }; radius = 1.0; material = "gold"; },
        { center = { x =  2.8; y = 1.0; z = 0.5; }; radius = 1.0; material = "silver"; },
        { center = { x =  4.5; y = 1.0; z = 0.0; }; radius = 1.0; material = "green_matte"; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0; material = "grey_floor"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.08; }
    );
    directional = (
        {
            direction = { x = -0.4; y = -1.0; z = -0.5; };
            color     = { r = 1.0; g = 0.95; b = 0.9; };
            intensity = 1.0;
        },
        {
            direction = { x =  0.6; y = -0.7; z = -0.3; };
            color     = { r = 0.5; g = 0.55; b = 0.7; };
            intensity = 0.3;
        }
    );
};
