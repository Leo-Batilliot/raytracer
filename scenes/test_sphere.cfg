// T1.1 validation scene: unit sphere at origin, camera at z=5.
// Run: ./raytracer scenes/test_sphere.cfg > /tmp/sphere.ppm

camera: {
    position = { x = 0.0; y = 0.0; z = 5.0; };
    lookAt   = { x = 0.0; y = 0.0; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 60.0;
    width  = 800;
    height = 600;
};

primitives: {
    spheres = (
        { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 1.0; }
    );
};
