// demo_sphere.cfg — T1.8
// Dramatic single sphere: Lambert + ambient, warm directional from upper-left.

camera:
{
    position = { x = 0.0; y = 1.2; z = 5.0; };
    lookAt   = { x = 0.0; y = 0.7; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 40.0;
    width  = 800;
    height = 600;
};

materials:
{
    crimson: { type = "flat_color"; color = { r = 0.85; g = 0.08; b = 0.08; }; };
    pearl:   { type = "flat_color"; color = { r = 0.92; g = 0.90; b = 0.88; }; };
};

primitives:
{
    spheres = (
        { center = { x = 0.0; y = 1.0; z = 0.0; }; radius = 1.0;
          material = "crimson"; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "pearl"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 0.9; b = 0.8; }; intensity = 0.15; }
    );
    directional = (
        { direction = { x = -1.0; y = -1.5; z = -1.0; };
          color = { r = 1.0; g = 0.95; b = 0.85; }; intensity = 1.1; }
    );
};
