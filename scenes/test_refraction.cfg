// test_refraction.cfg — Refraction / transparency (T4.3)
// A clear glass sphere (ior=1.5) sits above a red-and-white striped floor.
// The floor pattern must appear distorted and inverted inside the sphere.

camera:
{
    position = { x = 0.0; y = 2.0; z = 6.0; };
    lookAt   = { x = 0.0; y = 1.0; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov      = 45.0;
    width    = 320;
    height   = 240;
};

materials:
{
    glass_mat:
    {
        type         = "glass";
        transparency = 0.97;
        ior          = 1.5;
        color        = { r = 1.0; g = 1.0; b = 1.0; };
        ks           = 0.4;
        shininess    = 128.0;
        ka           = 0.02;
        kd           = 0.05;
    };
    red_floor:
    {
        type  = "flat_color";
        color = { r = 0.75; g = 0.1; b = 0.1; };
    };
    back_wall:
    {
        type  = "flat_color";
        color = { r = 0.2; g = 0.4; b = 0.8; };
    };
};

primitives:
{
    spheres = (
        { center = { x = 0.0; y = 1.0; z = 0.0; }; radius = 1.0;
          material = "glass_mat"; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "red_floor"; },
        { normal = { x = 0.0; y = 0.0; z = 1.0; }; distance = -4.0;
          material = "back_wall"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.1; }
    );
    directional = (
        {
            direction = { x = -0.5; y = -1.0; z = -0.3; };
            color     = { r = 1.0; g = 1.0; b = 1.0; };
            intensity = 0.9;
        }
    );
};
