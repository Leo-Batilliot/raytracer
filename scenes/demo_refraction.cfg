// demo_refraction.cfg — Refraction / transparency showcase (T4.3)
// Three glass spheres with different IOR values and tints over a coloured floor.
// Clear (ior=1.5), green-tinted (ior=1.6), diamond-like (ior=2.42).

camera:
{
    position = { x = 0.0; y = 4.0; z = 10.0; };
    lookAt   = { x = 0.0; y = 1.0; z =  0.0; };
    up       = { x = 0.0; y = 1.0; z =  0.0; };
    fov      = 50.0;
    width    = 800;
    height   = 600;
};

materials:
{
    glass_clear:
    {
        type         = "glass";
        transparency = 0.97;
        ior          = 1.5;
        color        = { r = 1.0; g = 1.0; b = 1.0; };
        ks           = 0.4;
        shininess    = 128.0;
        ka           = 0.02;
        kd           = 0.05;
    };
    glass_green:
    {
        type         = "glass";
        transparency = 0.95;
        ior          = 1.6;
        color        = { r = 0.75; g = 1.0; b = 0.75; };
        ks           = 0.3;
        shininess    = 64.0;
        ka           = 0.02;
        kd           = 0.05;
    };
    glass_diamond:
    {
        type         = "glass";
        transparency = 0.99;
        ior          = 2.42;
        color        = { r = 1.0; g = 1.0; b = 1.0; };
        ks           = 0.6;
        shininess    = 256.0;
        ka           = 0.02;
        kd           = 0.03;
    };
    // Opaque spheres visible behind the glass (give refraction something to distort)
    red_sphere:
    {
        type  = "phong";
        color = { r = 0.85; g = 0.1; b = 0.1; };
        ka = 0.05; kd = 0.9; ks = 0.2; shininess = 32.0;
    };
    blue_sphere:
    {
        type  = "phong";
        color = { r = 0.1; g = 0.2; b = 0.85; };
        ka = 0.05; kd = 0.9; ks = 0.2; shininess = 32.0;
    };
    grey_floor:
    {
        type  = "flat_color";
        color = { r = 0.5; g = 0.5; b = 0.5; };
    };
    orange_wall:
    {
        type  = "flat_color";
        color = { r = 0.9; g = 0.5; b = 0.1; };
    };
};

primitives:
{
    spheres = (
        // Three glass spheres
        { center = { x = -2.5; y = 1.0; z = 0.0; }; radius = 1.0;
          material = "glass_clear"; },
        { center = { x =  0.0; y = 1.0; z = 0.0; }; radius = 1.0;
          material = "glass_green"; },
        { center = { x =  2.5; y = 1.0; z = 0.0; }; radius = 1.0;
          material = "glass_diamond"; },
        // Opaque background spheres — distorted by the glass
        { center = { x = -1.5; y = 0.6; z = -4.0; }; radius = 0.6;
          material = "red_sphere"; },
        { center = { x =  1.5; y = 0.6; z = -4.0; }; radius = 0.6;
          material = "blue_sphere"; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance =  0.0;
          material = "grey_floor"; },
        { normal = { x = 0.0; y = 0.0; z = 1.0; }; distance = -5.0;
          material = "orange_wall"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.08; }
    );
    directional = (
        {
            direction = { x = -0.3; y = -1.0; z = -0.4; };
            color     = { r = 1.0; g = 0.98; b = 0.95; };
            intensity = 1.0;
        },
        {
            direction = { x =  0.6; y = -0.5; z = -0.2; };
            color     = { r = 0.4; g = 0.5; b = 0.7; };
            intensity = 0.25;
        }
    );
};
