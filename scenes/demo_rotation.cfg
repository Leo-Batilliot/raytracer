// demo_rotation.cfg — T2.3 showcase (800x600)
// Demonstrates rotation on all supported primitives.
// - 3 cylinders at various orientations (horizontal, diagonal, upright)
// - 2 cones tilted in different directions
// - 3 spheres as reference (no rotation)
// - Checkered floor plane

camera:
{
    position = { x = 0.0; y = 4.5; z = 11.0; };
    lookAt   = { x = 0.0; y = 0.8; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 50.0;
    width  = 800;
    height = 600;
};

materials:
{
    // Cylinders
    cobalt:   { type = "flat_color"; color = { r = 0.08; g = 0.28; b = 0.92; }; };
    crimson:  { type = "flat_color"; color = { r = 0.86; g = 0.08; b = 0.24; }; };
    jade:     { type = "flat_color"; color = { r = 0.00; g = 0.66; b = 0.42; }; };
    // Cones
    amber:    { type = "flat_color"; color = { r = 1.00; g = 0.55; b = 0.00; }; };
    violet:   { type = "flat_color"; color = { r = 0.54; g = 0.17; b = 0.89; }; };
    // Spheres (reference)
    pearl:    { type = "flat_color"; color = { r = 0.95; g = 0.92; b = 0.88; }; };
    gold:     { type = "flat_color"; color = { r = 1.00; g = 0.84; b = 0.00; }; };
    silver:   { type = "flat_color"; color = { r = 0.75; g = 0.75; b = 0.75; }; };
    // Floor
    slate:    { type = "flat_color"; color = { r = 0.44; g = 0.50; b = 0.56; }; };
};

primitives:
{
    cylinders = (
        // Cylinder 1: horizontal along X (rotZ = 90°)
        { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.3; height = 3.0;
          material = "cobalt";
          rotate    = { x = 0.0; y = 0.0; z = 90.0; };
          translate = { x = 0.0; y = 0.3; z = 1.0; }; },

        // Cylinder 2: tilted 45° forward (rotX = 45°)
        { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.3; height = 2.5;
          material = "crimson";
          rotate    = { x = 45.0; y = 0.0; z = 0.0; };
          translate = { x = 2.5; y = 1.0; z = 0.0; }; },

        // Cylinder 3: upright, no rotation (reference)
        { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.3; height = 2.0;
          material = "jade";
          translate = { x = -2.5; y = 1.0; z = 0.0; }; }
    );

    cones = (
        // Cone 1: tilted 40° around X (leaning back)
        { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.5; height = 1.8;
          material = "amber";
          rotate    = { x = 40.0; y = 0.0; z = 0.0; };
          translate = { x = -1.2; y = 0.9; z = -1.5; }; },

        // Cone 2: rotated 30° around Y then 25° around Z (compound rotation)
        { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.5; height = 1.8;
          material = "violet";
          rotate    = { x = 0.0; y = 30.0; z = 25.0; };
          translate = { x = 1.5; y = 0.9; z = -1.5; }; }
    );

    spheres = (
        { center = { x = -3.5; y = 0.5; z = -1.0; }; radius = 0.5; material = "pearl"; },
        { center = { x =  0.0; y = 0.5; z = -2.5; }; radius = 0.5; material = "gold"; },
        { center = { x =  3.5; y = 0.5; z = -1.0; }; radius = 0.5; material = "silver"; }
    );

    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0; material = "slate"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.18; }
    );
    directional = (
        // Key light: upper left
        { direction = { x = -1.0; y = -2.0; z = -1.0; };
          color = { r = 1.0; g = 0.96; b = 0.88; }; intensity = 0.90; },
        // Fill light: upper right, softer
        { direction = { x =  1.2; y = -1.5; z = -0.5; };
          color = { r = 0.72; g = 0.82; b = 1.00; }; intensity = 0.30; }
    );
};
