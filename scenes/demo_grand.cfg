// demo_grand.cfg — T2.5 grand showcase (1280x720)
// Every Phase 1+2 feature in a single scene:
//   Primitives : 6 spheres, 1 plane, 2 cylinders (upright + rotated), 2 cones (upright + tilted)
//   Materials  : 11 distinct flat-color materials
//   Transforms : translation on all objects, rotation on 1 cylinder + 2 cones
//   Lighting   : ambient + 2 directional (key + cool fill), all with shadow rays
//   Shadows    : visible on the floor from every object

camera:
{
    position = { x = 0.0; y = 5.0; z = 12.0; };
    lookAt   = { x = 0.0; y = 1.0; z =  0.0; };
    up       = { x = 0.0; y = 1.0; z =  0.0; };
    fov    = 55.0;
    width  = 1280;
    height = 720;
};

materials:
{
    pearl:    { type = "flat_color"; color = { r = 0.96; g = 0.93; b = 0.88; }; };
    ruby:     { type = "flat_color"; color = { r = 0.85; g = 0.08; b = 0.12; }; };
    sapphire: { type = "flat_color"; color = { r = 0.08; g = 0.22; b = 0.90; }; };
    emerald:  { type = "flat_color"; color = { r = 0.05; g = 0.72; b = 0.28; }; };
    amber:    { type = "flat_color"; color = { r = 1.00; g = 0.60; b = 0.00; }; };
    cobalt:   { type = "flat_color"; color = { r = 0.10; g = 0.30; b = 0.90; }; };
    copper:   { type = "flat_color"; color = { r = 0.85; g = 0.45; b = 0.18; }; };
    violet:   { type = "flat_color"; color = { r = 0.58; g = 0.10; b = 0.90; }; };
    crimson:  { type = "flat_color"; color = { r = 0.90; g = 0.08; b = 0.25; }; };
    silver:   { type = "flat_color"; color = { r = 0.75; g = 0.75; b = 0.75; }; };
    floor:    { type = "flat_color"; color = { r = 0.70; g = 0.68; b = 0.64; }; };
};

primitives:
{
    spheres = (
        // Hero sphere — centre, largest
        { center = { x =  0.0; y = 1.1; z =  0.0; }; radius = 1.1; material = "pearl"; },
        // Left-front small sphere
        { center = { x = -2.8; y = 0.55; z =  1.8; }; radius = 0.55; material = "ruby"; },
        // Right-front small sphere
        { center = { x =  2.8; y = 0.55; z =  1.8; }; radius = 0.55; material = "emerald"; },
        // Left-back medium sphere
        { center = { x = -3.2; y = 0.7; z = -1.5; }; radius = 0.7; material = "sapphire"; },
        // Right-back medium sphere
        { center = { x =  3.2; y = 0.7; z = -1.5; }; radius = 0.7; material = "amber"; },
        // Far-back accent sphere
        { center = { x =  0.0; y = 0.5; z = -4.0; }; radius = 0.5; material = "silver"; }
    );

    cylinders = (
        // Upright cobalt pillar — left side (no rotation)
        { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.28; height = 3.5;
          material = "cobalt";
          translate = { x = -1.5; y = 1.75; z = -2.5; }; },

        // Horizontal copper bar — right side (rotZ=90° → along X)
        { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.22; height = 3.2;
          material = "copper";
          rotate    = { x = 0.0; y = 0.0; z = 90.0; };
          translate = { x =  1.8; y = 0.22; z =  2.0; }; }
    );

    cones = (
        // Upright violet cone — right back (no rotation)
        { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.55; height = 2.0;
          material = "violet";
          translate = { x =  1.8; y = 1.0; z = -2.8; }; },

        // Tilted crimson cone — left front (rotX=38° leaning back)
        { center = { x = 0.0; y = 0.0; z = 0.0; }; radius = 0.5; height = 1.8;
          material = "crimson";
          rotate    = { x = 38.0; y = 0.0; z = 0.0; };
          translate = { x = -1.8; y = 0.9; z =  2.5; }; }
    );

    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0; material = "floor"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.12; }
    );
    directional = (
        // Key: warm, strong, upper-left
        { direction = { x = -1.0; y = -2.5; z = -0.8; };
          color = { r = 1.00; g = 0.96; b = 0.86; }; intensity = 1.0; },
        // Fill: cool, right, gentler
        { direction = { x =  1.2; y = -1.5; z = -0.5; };
          color = { r = 0.68; g = 0.80; b = 1.00; }; intensity = 0.28; }
    );
};
