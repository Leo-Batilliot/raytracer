// T1.3 + T1.4 combined: sphere + plane + ambient + directional light.
// Effect visible after T1.6 (lighting pipeline).
// Run: ./raytracer scenes/test_directional.cfg > /tmp/directional.ppm

camera: {
    position = { x = 0.0; y = 2.0; z = 6.0; };
    lookAt   = { x = 0.0; y = 0.5; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 60.0;
    width  = 800;
    height = 600;
};

primitives: {
    spheres = (
        { center = { x = 0.0; y = 0.5; z = 0.0; }; radius = 0.5; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0; }
    );
};

lights: {
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.15; }
    );
    directional = (
        {
            direction = { x = -1.0; y = -1.0; z = -1.0; };
            color     = { r = 1.0;  g = 1.0;  b = 1.0;  };
            intensity = 0.8;
        }
    );
};
