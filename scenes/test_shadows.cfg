// test_shadows.cfg — T2.4
// Validates drop shadows: a single sphere above a floor plane.
// The directional light comes from upper-left. The shadow cast on
// the floor must be visible as a clearly darker region.

camera:
{
    position = { x = 0.0; y = 3.0; z = 7.0; };
    lookAt   = { x = 0.0; y = 0.0; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 45.0;
    width  = 320;
    height = 240;
};

materials:
{
    red:   { type = "flat_color"; color = { r = 0.85; g = 0.15; b = 0.15; }; };
    floor: { type = "flat_color"; color = { r = 0.80; g = 0.80; b = 0.80; }; };
};

primitives:
{
    spheres = (
        { center = { x = 0.0; y = 1.0; z = 0.0; }; radius = 0.8; material = "red"; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0; material = "floor"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.15; }
    );
    directional = (
        // Light from upper-left: shadow falls to lower-right on the floor.
        { direction = { x = -1.0; y = -2.0; z = -0.5; };
          color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 1.0; }
    );
};
