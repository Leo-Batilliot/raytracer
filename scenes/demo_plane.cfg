// demo_plane.cfg — T1.8
// Infinite floor plane at low camera angle to show it stretching to horizon.
// A sphere sits on the floor to anchor the perspective.

camera:
{
    position = { x = 0.0; y = 0.6; z = 6.0; };
    lookAt   = { x = 0.0; y = 0.3; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 55.0;
    width  = 800;
    height = 600;
};

materials:
{
    cobalt:   { type = "flat_color"; color = { r = 0.1; g = 0.25; b = 0.9; }; };
    concrete: { type = "flat_color"; color = { r = 0.75; g = 0.73; b = 0.70; }; };
};

primitives:
{
    spheres = (
        { center = { x = 0.0; y = 0.5; z = 0.0; }; radius = 0.5;
          material = "cobalt"; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "concrete"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 0.8; g = 0.85; b = 1.0; }; intensity = 0.2; }
    );
    directional = (
        { direction = { x = -0.5; y = -1.0; z = -0.8; };
          color = { r = 1.0; g = 0.98; b = 0.90; }; intensity = 1.0; }
    );
};
