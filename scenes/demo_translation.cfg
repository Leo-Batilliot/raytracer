// demo_translation.cfg — T1.8
// All spheres use center={0,0,0} and are positioned exclusively via `translate`.
// Demonstrates the T1.7 translation feature: a 3×2 grid of spheres.

camera:
{
    position = { x = 0.0; y = 5.0; z = 10.0; };
    lookAt   = { x = 0.0; y = 1.0; z =  0.0; };
    up       = { x = 0.0; y = 1.0; z =  0.0; };
    fov    = 52.0;
    width  = 800;
    height = 600;
};

materials:
{
    r1: { type = "flat_color"; color = { r = 0.95; g = 0.10; b = 0.10; }; };
    r2: { type = "flat_color"; color = { r = 1.00; g = 0.45; b = 0.00; }; };
    r3: { type = "flat_color"; color = { r = 1.00; g = 0.88; b = 0.00; }; };
    r4: { type = "flat_color"; color = { r = 0.10; g = 0.80; b = 0.15; }; };
    r5: { type = "flat_color"; color = { r = 0.10; g = 0.35; b = 0.95; }; };
    r6: { type = "flat_color"; color = { r = 0.70; g = 0.00; b = 0.95; }; };
    ground: { type = "flat_color"; color = { r = 0.78; g = 0.76; b = 0.74; }; };
};

primitives:
{
    spheres = (
        // Row 1 (back)
        { center = { x=0.0; y=0.0; z=0.0; }; radius=0.55;
          material="r1"; translate={ x=-2.2; y=0.55; z=-1.5; }; },
        { center = { x=0.0; y=0.0; z=0.0; }; radius=0.55;
          material="r2"; translate={ x= 0.0; y=0.55; z=-1.5; }; },
        { center = { x=0.0; y=0.0; z=0.0; }; radius=0.55;
          material="r3"; translate={ x= 2.2; y=0.55; z=-1.5; }; },
        // Row 2 (front)
        { center = { x=0.0; y=0.0; z=0.0; }; radius=0.55;
          material="r4"; translate={ x=-2.2; y=0.55; z= 1.5; }; },
        { center = { x=0.0; y=0.0; z=0.0; }; radius=0.55;
          material="r5"; translate={ x= 0.0; y=0.55; z= 1.5; }; },
        { center = { x=0.0; y=0.0; z=0.0; }; radius=0.55;
          material="r6"; translate={ x= 2.2; y=0.55; z= 1.5; }; }
    );
    planes = (
        { normal = { x=0.0; y=1.0; z=0.0; }; distance=0.0; material="ground"; }
    );
};

lights:
{
    ambient = (
        { color = { r=1.0; g=1.0; b=1.0; }; intensity=0.18; }
    );
    directional = (
        { direction = { x=-1.0; y=-2.0; z=-0.8; };
          color = { r=1.0; g=0.97; b=0.88; }; intensity=1.0; }
    );
};
