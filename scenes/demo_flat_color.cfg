// demo_flat_color.cfg — T1.8
// Six spheres each with a distinct flat-color material, arranged in an arc.
// Shows material system + Lambert shading on varied hues.

camera:
{
    position = { x = 0.0; y = 3.5; z = 9.0; };
    lookAt   = { x = 0.0; y = 0.5; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 50.0;
    width  = 800;
    height = 600;
};

materials:
{
    red:    { type = "flat_color"; color = { r = 0.95; g = 0.10; b = 0.10; }; };
    orange: { type = "flat_color"; color = { r = 1.00; g = 0.50; b = 0.00; }; };
    yellow: { type = "flat_color"; color = { r = 1.00; g = 0.90; b = 0.00; }; };
    green:  { type = "flat_color"; color = { r = 0.10; g = 0.82; b = 0.15; }; };
    blue:   { type = "flat_color"; color = { r = 0.10; g = 0.30; b = 0.95; }; };
    purple: { type = "flat_color"; color = { r = 0.65; g = 0.00; b = 0.95; }; };
    slate:  { type = "flat_color"; color = { r = 0.68; g = 0.70; b = 0.72; }; };
};

primitives:
{
    spheres = (
        { center = { x = -3.5; y = 0.5; z =  0.0; }; radius = 0.55; material = "red";    },
        { center = { x = -2.1; y = 0.5; z = -1.0; }; radius = 0.55; material = "orange"; },
        { center = { x = -0.7; y = 0.5; z = -1.5; }; radius = 0.55; material = "yellow"; },
        { center = { x =  0.7; y = 0.5; z = -1.5; }; radius = 0.55; material = "green";  },
        { center = { x =  2.1; y = 0.5; z = -1.0; }; radius = 0.55; material = "blue";   },
        { center = { x =  3.5; y = 0.5; z =  0.0; }; radius = 0.55; material = "purple"; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0; material = "slate"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.18; }
    );
    directional = (
        { direction = { x = -1.0; y = -2.0; z = -0.5; };
          color = { r = 1.0; g = 0.97; b = 0.88; }; intensity = 1.0; }
    );
};
