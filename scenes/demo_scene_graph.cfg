// demo_scene_graph.cfg — T4.5 showcase (800x600)
// Demonstrates the scene graph: three groups, each a "molecule" of spheres.
// Each molecule has its own group transform (translate + rotate), proving that
// the group transform is applied uniformly to all children.
//
// Layout:
//   - Center group: a vertical stack of 3 spheres (red/white/blue), no rotation.
//   - Left group:   same 3 spheres, rotated 60° around Z (tilted left).
//   - Right group:  same 3 spheres, rotated -60° around Z (tilted right).
//   - Floor plane and two directional lights for nice shading.

camera:
{
    position = { x = 0.0; y = 3.5; z = 12.0; };
    lookAt   = { x = 0.0; y = 1.5; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 50.0;
    width  = 800;
    height = 600;
};

materials:
{
    // Molecule colors
    crimson:  { type = "phong"; color = { r = 0.85; g = 0.10; b = 0.10; };
                ka = 0.15; kd = 0.65; ks = 0.35; shininess = 64.0; };
    pearl:    { type = "phong"; color = { r = 0.96; g = 0.94; b = 0.90; };
                ka = 0.15; kd = 0.60; ks = 0.50; shininess = 128.0; };
    cobalt:   { type = "phong"; color = { r = 0.08; g = 0.28; b = 0.90; };
                ka = 0.15; kd = 0.65; ks = 0.35; shininess = 64.0; };
    // Left group
    amber:    { type = "phong"; color = { r = 1.00; g = 0.60; b = 0.00; };
                ka = 0.15; kd = 0.65; ks = 0.30; shininess = 48.0; };
    cream:    { type = "phong"; color = { r = 0.95; g = 0.92; b = 0.78; };
                ka = 0.15; kd = 0.60; ks = 0.45; shininess = 96.0; };
    teal:     { type = "phong"; color = { r = 0.00; g = 0.65; b = 0.60; };
                ka = 0.15; kd = 0.65; ks = 0.30; shininess = 48.0; };
    // Right group
    rose:     { type = "phong"; color = { r = 0.90; g = 0.30; b = 0.55; };
                ka = 0.15; kd = 0.65; ks = 0.35; shininess = 64.0; };
    silver:   { type = "phong"; color = { r = 0.78; g = 0.78; b = 0.78; };
                ka = 0.15; kd = 0.55; ks = 0.60; shininess = 200.0; };
    violet:   { type = "phong"; color = { r = 0.50; g = 0.15; b = 0.85; };
                ka = 0.15; kd = 0.65; ks = 0.35; shininess = 64.0; };
    // Scene
    floor:    { type = "phong"; color = { r = 0.40; g = 0.42; b = 0.45; };
                ka = 0.18; kd = 0.70; ks = 0.15; shininess = 16.0; };
};

// Floor as a standalone primitive (plane can't be inside a group — infinite bounds).
primitives:
{
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0; material = "floor"; }
    );
};

// Scene-graph groups — each is a "molecule" (stack of 3 spheres).
groups = (
    // Center molecule: upright stack.
    {
        translate = { x =  0.0; y = 0.0; z = 0.0; };
        children:
        {
            spheres = (
                { center = { x = 0.0; y = 0.60; z = 0.0; }; radius = 0.60; material = "crimson"; },
                { center = { x = 0.0; y = 1.52; z = 0.0; }; radius = 0.42; material = "pearl";   },
                { center = { x = 0.0; y = 2.22; z = 0.0; }; radius = 0.28; material = "cobalt";  }
            );
        };
    },
    // Left molecule: whole stack tilted 55° around Z (leans left).
    {
        translate = { x = -3.5; y = 0.6; z = -1.0; };
        rotate    = { x =  0.0; y =  0.0; z = 55.0; };
        children:
        {
            spheres = (
                { center = { x = 0.0; y = 0.55; z = 0.0; }; radius = 0.55; material = "amber"; },
                { center = { x = 0.0; y = 1.40; z = 0.0; }; radius = 0.38; material = "cream"; },
                { center = { x = 0.0; y = 2.03; z = 0.0; }; radius = 0.25; material = "teal";  }
            );
        };
    },
    // Right molecule: tilted -55° around Z (leans right), also rotated 30° around Y.
    {
        translate = { x =  3.5; y = 0.6; z = -1.0; };
        rotate    = { x =  0.0; y = 30.0; z = -55.0; };
        children:
        {
            spheres = (
                { center = { x = 0.0; y = 0.55; z = 0.0; }; radius = 0.55; material = "rose";   },
                { center = { x = 0.0; y = 1.40; z = 0.0; }; radius = 0.38; material = "silver"; },
                { center = { x = 0.0; y = 2.03; z = 0.0; }; radius = 0.25; material = "violet"; }
            );
        };
    }
);

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.15; }
    );
    directional = (
        // Key light: upper left
        { direction = { x = -1.0; y = -2.0; z = -1.0; };
          color = { r = 1.0; g = 0.97; b = 0.90; }; intensity = 0.90; },
        // Fill light: upper right, cooler
        { direction = { x =  1.5; y = -1.5; z = -0.5; };
          color = { r = 0.75; g = 0.85; b = 1.00; }; intensity = 0.30; }
    );
};
