// test_phong.cfg — Phong reflection model (T4.1)
// Single white sphere with a tight specular highlight.
// Camera is at origin; light is above-right (toward camera side) so
// the mirror-reflection direction points back toward the camera and a
// clear hot-spot appears on the sphere.

camera:
{
    position = { x = 0.0; y = 0.0; z = 5.0; };
    lookAt   = { x = 0.0; y = 0.0; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov      = 40.0;
    width    = 320;
    height   = 240;
};

materials:
{
    white_shiny:
    {
        type      = "phong";
        color     = { r = 0.8; g = 0.8; b = 0.8; };
        ka        = 0.05;
        kd        = 0.8;
        ks        = 0.9;
        shininess = 64.0;
        specular  = { r = 1.0; g = 1.0; b = 1.0; };
    };
};

primitives:
{
    spheres = (
        {
            center   = { x = 0.0; y = 0.0; z = 0.0; };
            radius   = 1.0;
            material = "white_shiny";
        }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.05; }
    );
    // Light positioned above and slightly to the right of the camera
    // so the reflection vector points back toward it.
    directional = (
        {
            direction = { x = -0.3; y = -0.5; z = -1.0; };
            color     = { r = 1.0; g = 1.0; b = 1.0; };
            intensity = 1.0;
        }
    );
};
