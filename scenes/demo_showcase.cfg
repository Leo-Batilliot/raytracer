// demo_showcase.cfg — T1.8
// 1280×720 showcase combining everything in Phase 1:
//   - 12 spheres with 10 distinct flat-color materials
//   - 2 planes (floor + back wall) with materials
//   - Ambient + directional lighting (Lambert shading)
//   - Mix of direct positioning (center) and translate
//   - Varied sizes for depth perception
//
// Composition: large central sphere flanked by a constellation of smaller
// spheres, two size groups (radius 0.7 and 0.35), all on a gray floor with
// a white back wall cutting the scene.

camera:
{
    position = { x = 0.5; y = 3.8; z = 12.0; };
    lookAt   = { x = 0.0; y = 1.2; z =  0.0; };
    up       = { x = 0.0; y = 1.0; z =  0.0; };
    fov    = 52.0;
    width  = 1280;
    height = 720;
};

materials:
{
    // Sphere materials
    silver:   { type = "flat_color"; color = { r = 0.88; g = 0.88; b = 0.90; }; };
    crimson:  { type = "flat_color"; color = { r = 0.92; g = 0.08; b = 0.08; }; };
    amber:    { type = "flat_color"; color = { r = 1.00; g = 0.55; b = 0.00; }; };
    gold:     { type = "flat_color"; color = { r = 1.00; g = 0.82; b = 0.00; }; };
    lime:     { type = "flat_color"; color = { r = 0.18; g = 0.90; b = 0.18; }; };
    teal:     { type = "flat_color"; color = { r = 0.00; g = 0.72; b = 0.75; }; };
    cobalt:   { type = "flat_color"; color = { r = 0.08; g = 0.28; b = 0.95; }; };
    violet:   { type = "flat_color"; color = { r = 0.60; g = 0.05; b = 0.90; }; };
    rose:     { type = "flat_color"; color = { r = 0.95; g = 0.40; b = 0.60; }; };
    mint:     { type = "flat_color"; color = { r = 0.50; g = 0.95; b = 0.72; }; };
    // Environment
    concrete: { type = "flat_color"; color = { r = 0.72; g = 0.71; b = 0.69; }; };
    wall:     { type = "flat_color"; color = { r = 0.90; g = 0.89; b = 0.86; }; };
};

primitives:
{
    spheres = (
        // ── Central feature sphere ──────────────────────────────────────────
        { center = { x= 0.0; y=1.4; z= 0.0; }; radius=1.4; material="silver"; },

        // ── Inner ring (radius 0.7, at distance ~3 from centre) ─────────────
        { center = { x=-2.8; y=0.7; z=-0.5; }; radius=0.7; material="crimson"; },
        { center = { x=-1.8; y=0.7; z=-2.8; }; radius=0.7; material="cobalt";  },
        { center = { x= 1.8; y=0.7; z=-2.8; }; radius=0.7; material="gold";    },
        { center = { x= 2.8; y=0.7; z=-0.5; }; radius=0.7; material="lime";    },

        // ── Outer accent spheres (radius 0.4, scattered) ───────────────────
        { center = { x=0.0; y=0.0; z=0.0; }; radius=0.40;
          material="amber";  translate={ x=-4.2; y=0.40; z= 1.5; }; },
        { center = { x=0.0; y=0.0; z=0.0; }; radius=0.40;
          material="teal";   translate={ x=-3.0; y=0.40; z= 2.8; }; },
        { center = { x=0.0; y=0.0; z=0.0; }; radius=0.40;
          material="violet"; translate={ x= 0.0; y=0.40; z= 3.5; }; },
        { center = { x=0.0; y=0.0; z=0.0; }; radius=0.40;
          material="rose";   translate={ x= 3.0; y=0.40; z= 2.8; }; },
        { center = { x=0.0; y=0.0; z=0.0; }; radius=0.40;
          material="mint";   translate={ x= 4.2; y=0.40; z= 1.5; }; },

        // ── Back elevated spheres ──────────────────────────────────────────
        { center = { x=-1.0; y=1.0; z=-5.0; }; radius=0.55; material="rose";   },
        { center = { x= 1.0; y=1.0; z=-5.0; }; radius=0.55; material="amber";  }
    );
    planes = (
        // Floor
        { normal = { x=0.0; y=1.0; z= 0.0; }; distance= 0.0; material="concrete"; },
        // Back wall
        { normal = { x=0.0; y=0.0; z= 1.0; }; distance=-8.0; material="wall"; }
    );
};

lights:
{
    ambient = (
        { color = { r=0.85; g=0.88; b=1.00; }; intensity=0.18; }
    );
    directional = (
        // Key light: warm, from upper-right-front
        { direction = { x= 1.0; y=-2.0; z= 0.8; };
          color = { r=1.0; g=0.95; b=0.82; }; intensity=0.9; },
        // Fill light: cool, from upper-left-back (weaker)
        { direction = { x=-1.0; y=-1.5; z=-1.0; };
          color = { r=0.7; g=0.80; b=1.00; }; intensity=0.35; }
    );
};
