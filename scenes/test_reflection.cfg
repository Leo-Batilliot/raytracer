// test_reflection.cfg — Reflection (T4.2)
// A near-perfect mirror sphere floats above a red floor.
// The reflection of the floor must be visible on the sphere.

camera:
{
    position = { x = 0.0; y = 2.0; z = 6.0; };
    lookAt   = { x = 0.0; y = 1.0; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov      = 45.0;
    width    = 320;
    height   = 240;
};

materials:
{
    mirror_mat:
    {
        type         = "mirror";
        reflectivity = 0.95;
        color        = { r = 0.9; g = 0.9; b = 0.95; };
        shininess    = 256.0;
        ks           = 0.9;
        ka           = 0.02;
        kd           = 0.2;
    };
    red_floor:
    {
        type  = "flat_color";
        color = { r = 0.75; g = 0.1; b = 0.1; };
    };
};

primitives:
{
    spheres = (
        { center = { x = 0.0; y = 1.0; z = 0.0; }; radius = 1.0;
          material = "mirror_mat"; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "red_floor"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.1; }
    );
    directional = (
        {
            direction = { x = -0.5; y = -1.0; z = -0.3; };
            color     = { r = 1.0; g = 1.0; b = 1.0; };
            intensity = 0.9;
        }
    );
};
