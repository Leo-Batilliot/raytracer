// demo_texture.cfg — T4.8 showcase (800x600)
// Earth globe + brick wall texture on a cylinder + tiled brick floor.
// Demonstrates texture mapping on different primitive types.

camera:
{
    position = { x = 0.0; y = 2.5; z = 9.0; };
    lookAt   = { x = 0.0; y = 1.0; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 50.0;
    width  = 800;
    height = 600;
};

materials:
{
    earth: {
        type = "texture"; file = "textures/earth.ppm";
        scale_u = 1.0; scale_v = 1.0;
        ka = 0.10; kd = 0.75; ks = 0.25; shininess = 48.0;
    };
    brick_wall: {
        type = "texture"; file = "textures/brick.ppm";
        scale_u = 3.0; scale_v = 2.0;
        ka = 0.15; kd = 0.82; ks = 0.06; shininess = 6.0;
    };
    brick_floor: {
        type = "texture"; file = "textures/brick.ppm";
        scale_u = 0.4; scale_v = 0.4;
        ka = 0.15; kd = 0.80; ks = 0.05; shininess = 4.0;
    };
    marble_sphere: {
        type = "perlin";
        color1 = { r = 0.96; g = 0.93; b = 0.88; };
        color2 = { r = 0.28; g = 0.22; b = 0.16; };
        scale = 1.2; octaves = 6; mode = "marble";
        ka = 0.12; kd = 0.70; ks = 0.50; shininess = 120.0;
    };
    mirror_sphere: {
        type = "mirror";
        color = { r = 0.96; g = 0.96; b = 0.96; };
        reflectivity = 0.90;
        ka = 0.05; kd = 0.10; ks = 0.80; shininess = 256.0;
    };
};

primitives:
{
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "brick_floor"; }
    );
    spheres = (
        // Earth globe — center stage
        { center = { x = 0.0;  y = 1.2; z =  0.5; }; radius = 1.2;
          material = "earth"; },
        // Mirror sphere — reflects the earth
        { center = { x = -3.2; y = 0.8; z =  1.5; }; radius = 0.8;
          material = "mirror_sphere"; },
        // Marble sphere
        { center = { x =  3.2; y = 0.8; z =  1.5; }; radius = 0.8;
          material = "marble_sphere"; }
    );
    cylinders = (
        // Brick column
        { center = { x = 0.0; y = 0.0; z = -2.5; }; radius = 0.6; height = 4.0;
          material = "brick_wall"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.14; }
    );
    directional = (
        { direction = { x = -1.0; y = -2.0; z = -1.0; };
          color = { r = 1.0; g = 0.96; b = 0.88; }; intensity = 0.88; },
        { direction = { x =  1.5; y = -1.5; z = -0.5; };
          color = { r = 0.72; g = 0.84; b = 1.00; }; intensity = 0.28; }
    );
};
