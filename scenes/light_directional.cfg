// light_directional.cfg — T1.8
// Directional light only (ambient near zero). Dramatic side-lighting shows the
// full Lambert gradient from bright highlight to near-black on the opposite side.
// Compare with light_ambient.cfg where everything is flat.

camera:
{
    position = { x = 2.0; y = 2.0; z = 7.0; };
    lookAt   = { x = 0.0; y = 0.5; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 48.0;
    width  = 800;
    height = 600;
};

materials:
{
    ivory:  { type = "flat_color"; color = { r = 0.95; g = 0.92; b = 0.80; }; };
    rose:   { type = "flat_color"; color = { r = 0.95; g = 0.45; b = 0.50; }; };
    teal:   { type = "flat_color"; color = { r = 0.10; g = 0.72; b = 0.70; }; };
    floor:  { type = "flat_color"; color = { r = 0.60; g = 0.58; b = 0.55; }; };
};

primitives:
{
    spheres = (
        { center = { x = -1.4; y = 0.7; z =  0.3; }; radius = 0.7; material = "rose";  },
        { center = { x =  0.5; y = 1.0; z = -0.5; }; radius = 1.0; material = "ivory"; },
        { center = { x =  2.0; y = 0.5; z =  0.8; }; radius = 0.5; material = "teal";  }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0; material = "floor"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.04; }
    );
    directional = (
        // Strong light from upper-left, slightly warm
        { direction = { x =  1.0; y = -1.8; z = -0.6; };
          color = { r = 1.0; g = 0.95; b = 0.80; }; intensity = 1.2; }
    );
};
