// test_cylinder.cfg — T2.1
// Finite cylinder with caps: teal body, gray floor.
// Camera looks slightly downward to see the top cap.

camera:
{
    position = { x = 2.0; y = 3.0; z = 6.0; };
    lookAt   = { x = 0.0; y = 1.0; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 45.0;
    width  = 320;
    height = 240;
};

materials:
{
    teal:  { type = "flat_color"; color = { r = 0.05; g = 0.70; b = 0.72; }; };
    floor: { type = "flat_color"; color = { r = 0.72; g = 0.71; b = 0.69; }; };
};

primitives:
{
    cylinders = (
        { center = { x = 0.0; y = 1.0; z = 0.0; };
          radius = 0.8; height = 2.0; material = "teal"; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "floor"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.18; }
    );
    directional = (
        { direction = { x = -1.0; y = -2.0; z = -0.8; };
          color = { r = 1.0; g = 0.97; b = 0.88; }; intensity = 1.0; }
    );
};
