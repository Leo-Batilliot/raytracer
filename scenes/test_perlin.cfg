// test_perlin.cfg — T4.7 minimal test (320x240)
// Three spheres, one per mode: turbulence, marble, noise.
// Expected: visually distinct organic patterns on each sphere.

camera:
{
    position = { x = 0.0; y = 2.0; z = 7.0; };
    lookAt   = { x = 0.0; y = 0.5; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 45.0;
    width  = 320;
    height = 240;
};

materials:
{
    turb: {
        type = "perlin";
        color1 = { r = 0.90; g = 0.85; b = 0.70; };
        color2 = { r = 0.20; g = 0.14; b = 0.08; };
        scale = 2.0; octaves = 4; mode = "turbulence";
        ka = 0.12; kd = 0.80; ks = 0.15; shininess = 24.0;
    };
    marble: {
        type = "perlin";
        color1 = { r = 0.95; g = 0.93; b = 0.88; };
        color2 = { r = 0.25; g = 0.20; b = 0.16; };
        scale = 1.5; octaves = 6; mode = "marble";
        ka = 0.12; kd = 0.72; ks = 0.45; shininess = 96.0;
    };
    noisemat: {
        type = "perlin";
        color1 = { r = 0.20; g = 0.45; b = 0.80; };
        color2 = { r = 0.05; g = 0.10; b = 0.30; };
        scale = 2.5; octaves = 3; mode = "noise";
        ka = 0.12; kd = 0.80; ks = 0.20; shininess = 32.0;
    };
    floor: {
        type = "perlin";
        color1 = { r = 0.55; g = 0.52; b = 0.45; };
        color2 = { r = 0.22; g = 0.18; b = 0.14; };
        scale = 0.8; octaves = 4; mode = "turbulence";
        ka = 0.15; kd = 0.80; ks = 0.05; shininess = 8.0;
    };
};

primitives:
{
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "floor"; }
    );
    spheres = (
        { center = { x = -2.2; y = 0.8; z = 0.0; }; radius = 0.8; material = "turb";    },
        { center = { x =  0.0; y = 0.8; z = 0.0; }; radius = 0.8; material = "marble";  },
        { center = { x =  2.2; y = 0.8; z = 0.0; }; radius = 0.8; material = "noisemat";}
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.18; }
    );
    directional = (
        { direction = { x = -1.0; y = -2.0; z = -1.0; };
          color = { r = 1.0; g = 0.97; b = 0.90; }; intensity = 0.88; }
    );
};
