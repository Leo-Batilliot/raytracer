// demo_cone.cfg — T2.2
// Cones and cylinders together: a construction-site composition.
// Three cones of different sizes + two cylinders as pillars, on a gray floor.

camera:
{
    position = { x = 1.5; y = 5.0; z = 11.0; };
    lookAt   = { x = 0.0; y =  1.5; z =  0.0; };
    up       = { x = 0.0; y =  1.0; z =  0.0; };
    fov    = 52.0;
    width  = 800;
    height = 600;
};

materials:
{
    amber:    { type = "flat_color"; color = { r = 1.00; g = 0.58; b = 0.00; }; };
    crimson:  { type = "flat_color"; color = { r = 0.88; g = 0.08; b = 0.08; }; };
    violet:   { type = "flat_color"; color = { r = 0.55; g = 0.05; b = 0.88; }; };
    cobalt:   { type = "flat_color"; color = { r = 0.10; g = 0.28; b = 0.90; }; };
    teal:     { type = "flat_color"; color = { r = 0.05; g = 0.65; b = 0.68; }; };
    concrete: { type = "flat_color"; color = { r = 0.70; g = 0.69; b = 0.67; }; };
};

primitives:
{
    cones = (
        // Large central cone
        { center = { x= 0.0; y=1.5; z= 0.0; }; radius=1.0; height=3.0;
          material="amber"; },
        // Medium left cone
        { center = { x=-2.5; y=1.0; z=-0.5; }; radius=0.65; height=2.0;
          material="crimson"; },
        // Small right cone, translated
        { center = { x=0.0; y=0.5; z=0.0; }; radius=0.4; height=1.0;
          material="violet"; translate={ x=2.8; y=0.0; z=0.5; }; }
    );
    cylinders = (
        // Left pillar
        { center = { x=-3.8; y=1.0; z=-1.5; }; radius=0.3; height=2.0;
          material="cobalt"; },
        // Right pillar
        { center = { x= 3.0; y=0.8; z=-1.5; }; radius=0.3; height=1.6;
          material="teal"; }
    );
    planes = (
        { normal = { x=0.0; y=1.0; z=0.0; }; distance=0.0;
          material="concrete"; }
    );
};

lights:
{
    ambient = (
        { color = { r=0.85; g=0.88; b=1.00; }; intensity=0.18; }
    );
    directional = (
        { direction = { x=-1.0; y=-2.5; z=-0.5; };
          color = { r=1.0; g=0.96; b=0.85; }; intensity=1.1; }
    );
};
