// demo_cylinder.cfg — T2.1
// 4 cylinders of different heights and colors, mixed with spheres.
// Camera elevated for an isometric-ish view showing both caps and bodies.

camera:
{
    position = { x = 1.0; y = 5.0; z = 10.0; };
    lookAt   = { x = 0.0; y =  1.5; z =  0.0; };
    up       = { x = 0.0; y =  1.0; z =  0.0; };
    fov    = 50.0;
    width  = 800;
    height = 600;
};

materials:
{
    crimson: { type = "flat_color"; color = { r = 0.88; g = 0.08; b = 0.08; }; };
    cobalt:  { type = "flat_color"; color = { r = 0.08; g = 0.28; b = 0.92; }; };
    amber:   { type = "flat_color"; color = { r = 1.00; g = 0.55; b = 0.00; }; };
    jade:    { type = "flat_color"; color = { r = 0.00; g = 0.60; b = 0.35; }; };
    gold:    { type = "flat_color"; color = { r = 1.00; g = 0.82; b = 0.00; }; };
    silver:  { type = "flat_color"; color = { r = 0.85; g = 0.85; b = 0.87; }; };
    ground:  { type = "flat_color"; color = { r = 0.70; g = 0.69; b = 0.67; }; };
};

primitives:
{
    cylinders = (
        // Tall narrow crimson column, left-back
        { center = { x=-2.5; y=1.5; z=-1.0; }; radius=0.35; height=3.0;
          material="crimson"; },
        // Squat wide cobalt drum, center
        { center = { x= 0.0; y=0.5; z= 0.0; }; radius=1.0; height=1.0;
          material="cobalt"; },
        // Medium amber column, right-back
        { center = { x= 2.5; y=1.0; z=-1.0; }; radius=0.45; height=2.0;
          material="amber"; },
        // Thin gold column translated, right-front
        { center = { x=0.0; y=0.75; z=0.0; }; radius=0.25; height=1.5;
          material="gold"; translate={ x=1.5; y=0.0; z=2.0; }; }
    );
    spheres = (
        // Sphere sitting on top of the cobalt drum
        { center = { x= 0.0; y=1.5; z= 0.0; }; radius=0.5;
          material="silver"; }
    );
    planes = (
        { normal = { x=0.0; y=1.0; z=0.0; }; distance=0.0; material="ground"; }
    );
};

lights:
{
    ambient = (
        { color = { r=0.85; g=0.88; b=1.00; }; intensity=0.18; }
    );
    directional = (
        { direction = { x=-1.0; y=-2.0; z=-0.6; };
          color = { r=1.0; g=0.96; b=0.85; }; intensity=1.0; }
    );
};
