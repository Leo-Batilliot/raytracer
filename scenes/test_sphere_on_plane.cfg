// T1.1 + T1.2 combined: sphere sitting on floor plane.
// Run: ./raytracer scenes/test_sphere_on_plane.cfg > /tmp/sphere_on_plane.ppm

camera: {
    position = { x = 0.0; y = 2.0; z = 6.0; };
    lookAt   = { x = 0.0; y = 0.5; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 60.0;
    width  = 800;
    height = 600;
};

primitives: {
    spheres = (
        { center = { x = 0.0; y = 0.5; z = 0.0; }; radius = 0.5; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0; }
    );
};
