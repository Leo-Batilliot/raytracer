// T1.2 validation: horizontal floor plane, camera at horizon level.
// Lower half of image shows floor (green-tinted normal); upper half sky.
// Run: ./raytracer scenes/test_plane.cfg > /tmp/plane.ppm

camera: {
    position = { x = 0.0; y = 1.0; z = 0.0; };
    lookAt   = { x = 0.0; y = 0.0; z = -5.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 60.0;
    width  = 800;
    height = 600;
};

primitives: {
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0; }
    );
};
