// light_ambient.cfg — T1.8
// Ambient light ONLY — all surfaces receive uniform illumination regardless of
// orientation. Demonstrates the difference from Lambert: spheres appear flat,
// no darkening on the sides facing away from any direction.

camera:
{
    position = { x = 0.0; y = 2.5; z = 8.0; };
    lookAt   = { x = 0.0; y = 0.5; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 50.0;
    width  = 800;
    height = 600;
};

materials:
{
    red:   { type = "flat_color"; color = { r = 0.95; g = 0.10; b = 0.10; }; };
    green: { type = "flat_color"; color = { r = 0.10; g = 0.82; b = 0.15; }; };
    blue:  { type = "flat_color"; color = { r = 0.10; g = 0.30; b = 0.95; }; };
    white: { type = "flat_color"; color = { r = 0.90; g = 0.90; b = 0.90; }; };
};

primitives:
{
    spheres = (
        { center = { x = -1.5; y = 0.6; z =  0.0; }; radius = 0.6; material = "red";   },
        { center = { x =  0.0; y = 0.6; z = -1.0; }; radius = 0.6; material = "green"; },
        { center = { x =  1.5; y = 0.6; z =  0.0; }; radius = 0.6; material = "blue";  }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0; material = "white"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.85; }
    );
};
