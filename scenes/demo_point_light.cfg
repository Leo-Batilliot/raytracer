// demo_point_light.cfg — T4.10 showcase (800x600)
// Three colored point lights (red/blue/white) demonstrating:
//   - Multiple point lights (T4.10)
//   - Colored lights with visible color mixing (T4.10)
//   - Distance attenuation (light fades naturally from each source)

camera:
{
    position = { x = 0.0; y = 3.5; z = 9.0; };
    lookAt   = { x = 0.0; y = 0.8; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 48.0;
    width  = 800;
    height = 600;
};

materials:
{
    silver: { type = "phong"; color = { r = 0.82; g = 0.82; b = 0.82; };
              ka = 0.08; kd = 0.55; ks = 0.70; shininess = 200.0; };
    pearl:  { type = "phong"; color = { r = 0.96; g = 0.93; b = 0.88; };
              ka = 0.08; kd = 0.65; ks = 0.55; shininess = 120.0; };
    obsidian: { type = "phong"; color = { r = 0.10; g = 0.09; b = 0.12; };
                ka = 0.08; kd = 0.50; ks = 0.80; shininess = 300.0; };
    ivory:  { type = "phong"; color = { r = 0.95; g = 0.91; b = 0.80; };
              ka = 0.08; kd = 0.65; ks = 0.40; shininess = 60.0; };
    // Simple neutral floor so the colored light halos stand out clearly
    floor:  { type = "phong"; color = { r = 0.72; g = 0.70; b = 0.66; };
              ka = 0.10; kd = 0.80; ks = 0.08; shininess = 8.0; };
};

primitives:
{
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "floor"; }
    );
    spheres = (
        { center = { x =  0.0; y = 0.9; z =  0.5; }; radius = 0.9; material = "pearl";    },
        { center = { x = -2.2; y = 0.7; z =  1.0; }; radius = 0.7; material = "silver";   },
        { center = { x =  2.2; y = 0.7; z =  1.0; }; radius = 0.7; material = "obsidian"; },
        { center = { x =  0.0; y = 0.5; z = -1.5; }; radius = 0.5; material = "ivory";    }
    );
};

lights:
{
    // Moderate ambient — enough to see the far floor without washing out the color
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.12; }
    );

    // Three colored point lights — color mixing demo
    point = (
        // Warm red — upper left
        { position  = { x = -3.5; y = 3.5; z = 2.5; };
          color     = { r = 1.00; g = 0.20; b = 0.05; };
          intensity = 3.5;
          constant  = 1.0; linear = 0.22; quadratic = 0.10; },

        // Cool blue — upper right
        { position  = { x =  3.5; y = 3.5; z = 2.5; };
          color     = { r = 0.10; g = 0.30; b = 1.00; };
          intensity = 3.5;
          constant  = 1.0; linear = 0.22; quadratic = 0.10; },

        // Neutral warm white — directly above
        { position  = { x =  0.0; y = 5.0; z = 0.5; };
          color     = { r = 1.00; g = 0.95; b = 0.85; };
          intensity = 5.0;
          constant  = 1.0; linear = 0.14; quadratic = 0.05; }
    );

    // Soft directional fill — prevents total darkness in shadowed areas
    directional = (
        { direction = { x =  0.5; y = -1.0; z =  0.5; };
          color = { r = 0.60; g = 0.70; b = 0.80; }; intensity = 0.25; },
        { direction = { x = -0.5; y = -1.0; z =  0.5; };
          color = { r = 0.70; g = 0.60; b = 0.50; }; intensity = 0.20; }
    );
};
