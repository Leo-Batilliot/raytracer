// T1.3 validation: sphere + plane + ambient light registered in scene.
// Effect visible after T1.6 (lighting pipeline). Until then, image is
// identical to test_sphere_on_plane.cfg — the criterion is 0 warnings.
// Run: ./raytracer scenes/test_ambient.cfg > /tmp/ambient.ppm

camera: {
    position = { x = 0.0; y = 2.0; z = 6.0; };
    lookAt   = { x = 0.0; y = 0.5; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 60.0;
    width  = 800;
    height = 600;
};

primitives: {
    spheres = (
        { center = { x = 0.0; y = 0.5; z = 0.0; }; radius = 0.5; }
    );
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0; }
    );
};

lights: {
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.15; }
    );
};
