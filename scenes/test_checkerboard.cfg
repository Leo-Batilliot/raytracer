// test_checkerboard.cfg — T4.6 minimal test (320x240)
// Checkerboard floor (scale=1: tiles 1×1 world units) with a single
// white Phong sphere on top. Expected: alternating black/white squares
// clearly visible on the floor.

camera:
{
    position = { x = 0.0; y = 3.0; z = 8.0; };
    lookAt   = { x = 0.0; y = 0.0; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 45.0;
    width  = 320;
    height = 240;
};

materials:
{
    checker: {
        type   = "checkerboard";
        color1 = { r = 0.92; g = 0.92; b = 0.92; };
        color2 = { r = 0.08; g = 0.08; b = 0.08; };
        scale  = 1.0;
        ka = 0.18; kd = 0.80; ks = 0.08; shininess = 16.0;
    };
    white_sphere: {
        type = "phong";
        color = { r = 0.95; g = 0.92; b = 0.88; };
        ka = 0.15; kd = 0.65; ks = 0.50; shininess = 128.0;
    };
};

primitives:
{
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "checker"; }
    );
    spheres = (
        { center = { x = 0.0; y = 1.0; z = 0.0; }; radius = 1.0;
          material = "white_sphere"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.18; }
    );
    directional = (
        { direction = { x = -1.0; y = -2.0; z = -1.0; };
          color = { r = 1.0; g = 0.97; b = 0.90; }; intensity = 0.90; }
    );
};
