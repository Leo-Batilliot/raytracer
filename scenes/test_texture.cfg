// test_texture.cfg — T4.8 minimal test (320x240)
// Three spheres: earth texture, brick texture, UV debug grid.
// Validates that the file loader and bilinear sampling work.

camera:
{
    position = { x = 0.0; y = 2.0; z = 7.0; };
    lookAt   = { x = 0.0; y = 0.5; z = 0.0; };
    up       = { x = 0.0; y = 1.0; z = 0.0; };
    fov    = 45.0;
    width  = 320;
    height = 240;
};

materials:
{
    earth: {
        type = "texture"; file = "textures/earth.ppm";
        scale_u = 1.0; scale_v = 1.0;
        ka = 0.12; kd = 0.80; ks = 0.15; shininess = 32.0;
    };
    brick_sphere: {
        type = "texture"; file = "textures/brick.ppm";
        scale_u = 2.0; scale_v = 3.0;
        ka = 0.12; kd = 0.82; ks = 0.08; shininess = 8.0;
    };
    uvgrid: {
        type = "texture"; file = "textures/uvgrid.ppm";
        scale_u = 1.0; scale_v = 1.0;
        ka = 0.15; kd = 0.80; ks = 0.05; shininess = 4.0;
    };
    floor: {
        type = "texture"; file = "textures/brick.ppm";
        scale_u = 0.5; scale_v = 0.5;
        ka = 0.15; kd = 0.82; ks = 0.05; shininess = 4.0;
    };
};

primitives:
{
    planes = (
        { normal = { x = 0.0; y = 1.0; z = 0.0; }; distance = 0.0;
          material = "floor"; }
    );
    spheres = (
        { center = { x = -2.2; y = 0.8; z = 0.0; }; radius = 0.8;
          material = "earth"; },
        { center = { x =  0.0; y = 0.8; z = 0.0; }; radius = 0.8;
          material = "brick_sphere"; },
        { center = { x =  2.2; y = 0.8; z = 0.0; }; radius = 0.8;
          material = "uvgrid"; }
    );
};

lights:
{
    ambient = (
        { color = { r = 1.0; g = 1.0; b = 1.0; }; intensity = 0.18; }
    );
    directional = (
        { direction = { x = -1.0; y = -2.0; z = -1.0; };
          color = { r = 1.0; g = 0.97; b = 0.90; }; intensity = 0.88; }
    );
};
